<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひらがな と ことば</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f5;color:#233e38;font-family:'UD Digi Kyokasho N-R','UD デジタル 教科書体 N-R','BIZ UDGothic',sans-serif}button,select,input{font:inherit;color:inherit}button{border:2px solid #b7c9c1;border-radius:14px;background:white;padding:0 5px;cursor:pointer;touch-action:manipulation;min-height:44px;font-weight:bold}button:focus-visible{outline:4px solid #eab742;outline-offset:-4px}button:disabled{opacity:.42;cursor:default}.primary{background:#285f50;color:white;border-color:#285f50}.selected{border-color:#285f50;background:#dfefe6;box-shadow:inset 0 0 0 2px #285f50}#app{height:100dvh;display:grid;grid-template-rows:50px minmax(0,1fr) 66px;gap:5px;padding:6px 12px;max-width:1400px;margin:auto}header,footer{display:flex;align-items:center;gap:8px}header h1{font-size:clamp(20px,3vw,34px);margin:0;flex:1}header button{font-size:18px;min-height:38px}#status{font-size:18px}main{min-height:0;overflow:hidden}footer button{height:100%;font-size:clamp(24px,3.5vw,38px);min-width:140px}footer #message{flex:1;text-align:center;font-size:clamp(22px,3vw,36px);font-weight:bold}#home{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}.intro{margin:0;font-size:clamp(16px,2vw,22px)}#sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}.set{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(30px,4vw,58px)}.set small{font-size:18px;font-weight:normal}.set svg{width:100%;height:45%;max-height:130px}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.modes button{font-size:clamp(16px,2.3vw,26px);min-height:52px}.stage{height:100%;display:grid;grid-template-rows:minmax(0,1fr) minmax(90px,30%);gap:6px}.art{display:flex;align-items:center;justify-content:center;min-height:0;background:white;border-radius:20px}.art svg{height:100%;width:100%;max-width:680px}.word{display:flex;align-items:center;justify-content:center;font-size:clamp(58px,11vw,140px);line-height:1.1;white-space:nowrap;font-weight:bold;color:#172d27}.word.marked .target{text-decoration:underline;text-decoration-color:#8aaa9b;text-underline-offset:12px}.quiz{height:100%;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,45%);gap:8px}.choices{display:grid;gap:8px;min-height:0}.choices button{min-height:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,min(7vw,10.5vh),90px)}.choices svg{width:100%;height:100%}.choices .correct{border:6px solid #33845b;background:#eef9f0}.choices .correct:after{content:'○';position:absolute;right:5px;top:0;font-size:60px;line-height:1;color:#228044;background:#ffffffd9;border-radius:50%}.choices .retry{background:#fff5dc}.quiz .word{font-size:clamp(58px,10vw,130px)}#settings{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:6px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:18px}.controls select{height:38px;background:white;border:1px solid #b7c9c1;border-radius:8px}.kana{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(5,minmax(0,1fr));grid-auto-flow:column;direction:rtl;gap:4px}.kana button{direction:ltr;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:clamp(22px,4vw,44px)}.kana small{font-size:clamp(9px,1.1vw,14px);font-weight:normal}.kana .later{opacity:.5}.summary{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.summary h2{font-size:clamp(34px,5vw,64px);margin:0}.summary p{font-size:clamp(20px,3vw,30px);margin:0;text-align:center}.summary button{font-size:32px;min-height:56px}.note{font-size:15px;margin:0}.hidden{display:none!important}@media(max-height:520px){#app{grid-template-rows:38px minmax(0,1fr) 48px;gap:3px}header h1{font-size:22px}header button{min-height:32px}.controls{font-size:14px;gap:4px}.controls select{height:30px}.intro,.note{font-size:13px}.modes button{min-height:38px}.set small{font-size:14px}.stage{grid-template-rows:minmax(0,1fr) 30%}.word{font-size:64px}.kana small{font-size:9px}}
@media(orientation:portrait){#sets{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}.set{font-size:34px}.modes{grid-template-columns:repeat(2,minmax(0,1fr))}header h1{font-size:22px}#status{font-size:14px}footer button{min-width:100px}.controls{font-size:15px;gap:6px}.kana{gap:2px}.kana button{font-size:30px;padding:0}.kana small{font-size:9px}}

.set span{font-size:clamp(20px,2.8vw,38px);max-width:98%;overflow-wrap:anywhere;line-height:1.4}.card-grid{min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:5px}.card-grid button{min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:clamp(16px,min(3vw,4.5vh),32px);line-height:1.4}.card-grid small{font-size:11px;font-weight:normal}.summary p{max-width:98%;overflow-wrap:anywhere}.controls{gap:6px;font-size:16px}.word{font-size:clamp(40px,min(10vw,16vh),128px);line-height:1.35}
@media(orientation:portrait){.card-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card-grid button{font-size:24px}.set span{font-size:26px}}
@media(max-height:520px){.controls{font-size:13px;gap:4px}.controls select{height:30px}.card-grid button{font-size:22px;flex-direction:row;gap:6px}.card-grid small{font-size:10px}.summary{gap:7px}.summary h2{font-size:32px}.summary p{font-size:18px}.summary button{min-height:42px;font-size:25px}}

.choices button{min-width:0}.card-grid button{overflow:hidden}.summary{overflow:hidden}.summary .word{width:100%;flex:1}.summary h2{max-width:100%;min-height:0}.summary>p:not(.note){width:100%;min-height:0;overflow:hidden}.summary .controls{flex-shrink:0}.summary button{min-width:100px;max-width:100%;overflow:hidden}#message{min-width:0;overflow:hidden}

#home.category-home{grid-template-rows:minmax(0,1fr) auto}.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-height:0}.category-grid button{min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,4vw,58px)}
#correctOverlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#ffffffb8}#correctOverlay[hidden]{display:none}.correct-pop{display:flex;flex-direction:column;align-items:center;gap:8px;animation:correct-pop-in .18s ease-out}.red-circle{width:min(48vh,46vw);height:min(48vh,46vw);border:clamp(12px,2.4vmin,28px) solid #e22430;border-radius:50%;box-sizing:border-box}.correct-label{color:#df1425;font-family:var(--learning-font);font-weight:600;font-size:clamp(40px,10vmin,100px);line-height:1.3;text-shadow:0 2px 0 white}
@keyframes correct-pop-in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.correct-pop{animation:none}}
@media(orientation:portrait){.category-grid{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr))}.red-circle{width:58vw;height:58vw}}

:root{--control-height:clamp(64px,13vh,110px)}html,body{background:#123e32;color:#fff9e8}body{background:radial-gradient(ellipse at 50% 30%,#205443 0,#133e32 75%)}#app{grid-template-rows:50px minmax(0,1fr) var(--control-height)}button,select,input{color:#213d32}button{background:#fffdf1;border-color:#9eb9a5}.primary{background:#efe7b6;color:#173e2e;border-color:#dacf95}.selected{background:#f7e7a0;border-color:#f4ca46;box-shadow:inset 0 0 0 2px #9b7b27}.word{color:#fff9e8}.art{background:#fffdf5}.choices .fit-text{color:#213d32}.note,.intro{color:#f1f0db}.card-grid small{color:#48604c}
body[data-screen="home"] header h1{display:none}body[data-screen="home"] #status{margin-left:auto}#home.category-home{display:flex;flex-direction:column;justify-content:center;gap:16px}.master-title{font-family:var(--learning-font);font-size:80px;font-weight:1000;-webkit-text-stroke:2.4px currentColor;text-align:center;margin:0;width:100%;height:clamp(72px,17vh,132px);flex-shrink:0;display:flex;align-items:center;justify-content:center}.master-title .fit-text{font-weight:1000}.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);height:calc((100dvh - 200px)*.25);min-height:64px;flex-shrink:0;gap:10px;width:100%}.category-grid button{font-size:44px}.category-grid .fit-text{line-height:1.15}.category-home .modes{margin-top:auto}.modes{height:var(--control-height);flex-shrink:0}.modes button{font-size:52px;min-height:0}footer button{font-size:68px}#back,#next{width:32%;max-width:500px}.summary button{height:clamp(64px,13vh,100px);min-height:64px;font-size:64px}.summary{gap:8px}.summary h2{color:#fff9e8}.summary>p{color:#fff9e8}#correctOverlay{background:#123e3299}.correct-pop{background:#fffdf0f5;border-radius:24px;padding:12px 24px}.correct-label{text-shadow:none}
@media(orientation:portrait){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));height:calc((100dvh - 200px)*.25);min-height:150px}.category-home .modes{grid-template-columns:repeat(2,minmax(0,1fr));height:calc(var(--control-height)*1.5)}.master-title{font-size:80px}.modes button{font-size:44px}}
@media(max-height:520px){#app{grid-template-rows:38px minmax(0,1fr) 64px}.master-title{height:68px;font-size:64px}.category-grid{height:70px}.modes{height:64px}.summary{gap:3px}.summary h2{font-size:28px}.summary button{min-height:58px;height:58px}.summary p{font-size:16px}}
footer button,.modes button,.summary button{line-height:1;display:flex;align-items:center;justify-content:center;min-height:0}

#correctOverlay,.correct-pop{background:transparent;box-shadow:none}.correct-pop{padding:0}.result-actions{display:flex;justify-content:center;gap:10px;width:96%;flex-shrink:0}.result-actions button{flex:1;min-width:0;width:0;max-width:480px}.help-page{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}.help-page h2{margin:0;text-align:center;font-size:clamp(26px,4vw,40px);font-family:var(--learning-font)}.help-items{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;min-height:0}.help-items article{background:#fffdf0;color:#213d32;border-radius:12px;padding:5px 14px;display:flex;flex-direction:column;justify-content:center;min-height:0}.help-items h3{font-size:clamp(18px,2.5vw,26px);margin:0 0 3px}.help-items p{font-size:clamp(16px,2.1vw,23px);line-height:1.4;margin:0}.help-page{font-family:var(--learning-font)}
@media(max-height:520px){.help-page{gap:4px}.help-page h2{font-size:24px}.help-items{gap:4px}.help-items h3{font-size:18px;margin:0}.help-items p{font-size:15px;line-height:1.25}.help-items article{padding:2px 10px}.result-actions button{height:58px}}
@media(orientation:portrait){.help-items p{font-size:19px}.help-items p br{display:none}}

function nextLearnSelection(course){const list=pool(course);if(course!==studyCourse)return chunks(list)[0];const last=Math.max(...deck.map(c=>list.findIndex(x=>x.id===c.id)));let upcoming=list.slice(last+1,last+1+config.size);if(!upcoming.length)upcoming=list.filter(c=>!progress[c.id]?.learn?.complete).slice(0,config.size);if(!upcoming.length)upcoming=list.slice(0,config.size);if(upcoming.length<2)upcoming.push(list.find(c=>c.id!==upcoming[0].id));return upcoming.map(c=>c.id)}

$('course').onchange=()=>{manualCourse=$('course').value==='auto'?null:$('course').value;page=0;selected=nextSelection(activeCourse());settings()};['size','choices','rounds','fade'].forEach(id=>$(id).onchange=()=>{config[id]=Number($(id).value);save()});$('voice').onchange=()=>{config.voice=$('voice').checked;save();if(config.voice)say('ひらがな')};document.querySelectorAll('[data-kana]').forEach(b=>b.onclick=gated(()=>{const id=b.dataset.kana;if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<5)selected.push(id);else{$('message').textContent='５語まで';return}b.classList.toggle('selected',selected.includes(id));updateCount()}));bind('auto',()=>{selected=nextSelection(course);settings()});bind('oral',()=>{if(selected.length)oralCheck(0)});let confirmReset=false;bind('reset',()=>{if(!confirmReset){confirmReset=true;$('reset').textContent='もう一度押すと消去';return}progress={};manualCourse=null;selected=['め','て'];page=0;save();settings()});bind('back',()=>{$('back').textContent='もどる';page=0;home()});bind('next',()=>{$('back').textContent='もどる';start()});updateCount()}

// 300% is the desired size; clamp to the measured box to keep every control visible.
let fontFitFrame=0;
const fitSelector='.master-title,.category-grid button,.word,.set>span,.set>small,.modes button,.choices button:not(:has(svg)),footer button,header h1,header button,#message,.summary h2,.summary>p:not(.note),.summary button,.card-grid button';
function queueFontFit(){if(!fontFitFrame)fontFitFrame=requestAnimationFrame(()=>{fontFitFrame=0;fitLearningText()})}
function fitLearningText(){fontObserver.disconnect();
 document.querySelectorAll(fitSelector).forEach(el=>{
  const textNodes=[...el.childNodes].filter(n=>n.nodeType===3&&n.textContent.trim());
  for(const node of textNodes){if(!/[ぁ-ゖ]/.test(node.textContent))continue;const span=document.createElement('span');span.className='fit-text';node.replaceWith(span);span.appendChild(node)}
  const label=[...el.children].find(c=>c.classList.contains('fit-text'));if(!label)return;
  label.style.fontSize='inherit';const base=parseFloat(getComputedStyle(el).fontSize),style=getComputedStyle(el);let w=el.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)-16,h=el.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)-18;
  if(el.matches('.master-title')){w=el.clientWidth-12;h=el.clientHeight-6}
  if(el.matches('header h1'))h=el.parentElement.clientHeight-4;
  if(el.matches('header button')){w=Math.min(140,innerWidth*.14);h=Math.min(el.clientHeight-8,el.parentElement.clientHeight-10);el.style.width=(w+12)+'px'}
  if(el.matches('.set>small')){h=Math.min(36,el.parentElement.clientHeight*.2);w=el.parentElement.clientWidth-12}
  if(el.matches('.card-grid button')&&getComputedStyle(el).flexDirection==='column'){const small=el.querySelector('small');h-=small?small.getBoundingClientRect().height:0}
  if(el.matches('.card-grid button')&&getComputedStyle(el).flexDirection==='row'){const small=el.querySelector('small');w-=small?small.getBoundingClientRect().width+6:0}
  if(el.matches('.summary h2')){h=Math.min(100,$('main').clientHeight*.18);w=$('main').clientWidth-16}
  if(el.matches('.summary>p:not(.note)')){h=Math.min(90,$('main').clientHeight*.12);w=$('main').clientWidth-16}
  if(el.matches('.summary button')){h=el.clientHeight-6;w=el.closest('.result-actions')?el.clientWidth-16:Math.min(380,$('main').clientWidth*.7);if(!el.closest('.result-actions'))el.style.width=(w+12)+'px'}
  let low=8,high=el.matches('.master-title')?base:base*(el.matches('.modes button,footer button,.summary button,header button')?6:3);
  for(let i=0;i<12;i++){const mid=(low+high)/2;label.style.fontSize=mid+'px';const r=label.getBoundingClientRect();if(Math.max(r.width,label.scrollWidth)<=w&&Math.max(r.height,label.scrollHeight)<=h)low=mid;else high=mid}
  label.style.fontSize=Math.floor(low)+'px';label.dataset.requestedSize=String(Math.round(base*3));
 });
 fontObserver.observe($('app'),{subtree:true,childList:true,characterData:true});
}
