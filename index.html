const rows=[['あ','あめ','rain'],['い','いぬ','dog'],['う','うし','cow'],['え','え','picture'],['お','お','tail'],['か','か','mosquito'],['き','き','tree'],['く','くつ','shoes'],['け','け','hair'],['こ','こま','top'],['さ','さかな','fish'],['し','しか','deer'],['す','す','nest'],['せ','せみ','cicada'],['そ','そら','sky'],['た','たこ','octopus'],['ち','ち','blood'],['つ','つき','moon'],['て','て','hand'],['と','とり','bird'],['な','なす','eggplant'],['に','にく','meat'],['ぬ','ぬの','cloth'],['ね','ねこ','cat'],['の','のり','seaweed'],['は','は','tooth'],['ひ','ひ','fire'],['ふ','ふね','boat'],['へ','へそ','navel'],['ほ','ほ','sail'],['ま','まめ','beans'],['み','み','fruit'],['む','むし','bug'],['め','め','eye'],['も','もも','peach'],['や','や','arrow'],['ゆ','ゆ','hotwater'],['よ','よる','night'],['ら','さくら','sakura'],['り','りす','squirrel'],['る','さる','monkey'],['れ','れい','bow'],['ろ','ろうそく','candle'],['わ','わ','ring'],['を','えをかく','draw']];

['d-key','ぎ','かぎ','key','daku'],['d-elephant','ぞ','ぞう','elephant','daku'],['d-pig','ぶ','ぶた','pig','daku'],['d-snake','び','へび','snake','daku'],['d-daruma','だ','だるま','daruma','daku'],

['h-bread','ぱ','ぱん','bread','handaku'],['h-piano','ぴ','ぴあの','piano','handaku'],['h-pudding','ぷ','ぷりん','pudding','handaku'],['h-pen','ぺ','ぺん','pen','handaku'],['h-post','ぽ','ぽすと','postbox','handaku'],

['y-cabbage','きゃ','きゃべつ','cabbage','you'],['y-paddle','しゃ','しゃもじ','ricepaddle','you'],['y-butterfly','ちょ','ちょう','butterfly','you'],['y-cucumber','きゅ','きゅうり','cucumber','you'],['y-tea','ちゃ','おちゃ','tea','you']];
const cards=rows.map(([kana,word,art])=>({id:kana,kana,word,art,group:'len'+word.length})).concat(specialRows.map(([id,kana,word,art,group])=>({id,kana,word,art,group})));
const courses=[['len1','１もじ'],['len2','２もじ'],['len3','３もじ'],['len4','４もじ'],['daku','だくおん'],['hatsu','「ん」'],['handaku','はんだくおん'],['soku','ちいさい「っ」'],['you','「きゃ・しゅ・ちょ」']].map(([id,label])=>({id,label}));
let manualCourse=null,studyCourse='len1';
const introOrder=['め','て','は','き','お','か','す','ひ','や','わ','え','け','ち','ほ','み','ゆ'];
function pool(id){return cards.filter(c=>c.group===id).sort((a,b)=>id==='len1'?introOrder.indexOf(a.id)-introOrder.indexOf(b.id):0)}
function complete(c){const p=progress[c.id]||{};return !!(p.p2w?.complete&&p.w2p?.complete)}
function activeCourse(){return manualCourse||courses.find(g=>pool(g.id).some(c=>!complete(c)))?.id||'you'}
function chunks(list){const out=[];for(let i=0;i<list.length;i+=config.size){const a=list.slice(i,i+config.size);if(a.length===1)a.push(list.find(c=>c.id!==a[0].id));out.push(a.map(c=>c.id))}return out}
function nextSelection(id){const list=pool(id),todo=list.filter(c=>!complete(c));let a=todo.slice(0,config.size);if(a.length<2)a=[...a,...list.filter(c=>!a.includes(c)).slice(0,2-a.length)];return a.map(c=>c.id)}
 const byId=id=>cards.find(c=>c.id===id);
function svg(c){return '<svg xmlns="'+NS+'" viewBox="0 0 200 200" aria-hidden="true">'+A[c.art]+'</svg>'}
let saved={},storageOK=true;try{saved=JSON.parse(localStorage.getItem('hiragana-v1')||'{}')||{}}catch(e){storageOK=false}
let progress=saved.progress&&typeof saved.progress==='object'?saved.progress:{};
let config={size:2,choices:2,rounds:1,fade:.25,voice:false,...saved.config};
config.size=Math.max(2,Math.min(5,Number(config.size)||2));config.choices=Math.max(2,Math.min(4,Number(config.choices)||2));config.rounds=Math.max(1,Math.min(3,Number(config.rounds)||1));config.fade=[.15,.25,.4].includes(Number(config.fade))?Number(config.fade):.25;
let selected=['め','て'],mode='all',screen='home',deck=[],steps=[],pos=0,answered=false,wrong=false,lock=0,options=[],session={},recorded=new Set(),page=0;
function save(){try{localStorage.setItem('hiragana-v1',JSON.stringify({config,progress}));}catch(e){storageOK=false}}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function gated(fn){return()=>{if(Date.now()<lock)return;lock=Date.now()+300;fn()}}
function bind(id,fn){$(id).onclick=gated(fn)}
function clearVoice(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function say(text){if(!config.voice||!('speechSynthesis'in window))return;clearVoice();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.7;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}
function base(label){$('status').textContent=label;$('message').textContent='';$('back').disabled=false;$('next').disabled=false;$('next').textContent='つぎへ';$('settingsBtn').hidden=screen!=='home'&&screen!=='settings';clearVoice()}
function home(){screen='home';const course=activeCourse(),list=pool(course),sets=chunks(list),pages=Math.ceil(sets.length/6);page=Math.min(page,pages-1);base(courses.find(g=>g.id===course).label);$('back').textContent='もどる';$('back').disabled=page===0;$('next').textContent='ほかの ことば';$('next').disabled=pages===1;
$('main').innerHTML='<section id="home"><p class="intro">ことばを えらぼう　'+list.filter(complete).length+' / '+list.length+' おわり</p><div id="sets">'+sets.slice(page*6,page*6+6).map((ids,i)=>'<button class="set" data-set="'+i+'">'+svg(byId(ids[0]))+'<span>'+ids.map(id=>byId(id).word).join('・')+'</span><small>'+ (ids.every(id=>complete(byId(id)))?'○ もういちど':'はじめる')+'</small></button>').join('')+'</div><div class="modes">'+[['all','まとめて'],['learn','おぼえる'],['p2w','え → ことば'],['w2p','ことば → え']].map(([id,label])=>'<button class="'+(mode===id?'selected':'')+'" data-mode="'+id+'">'+label+'</button>').join('')+'</div></section>';
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=gated(()=>{selected=sets[page*6+Number(b.dataset.set)];start()}));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=gated(()=>{mode=b.dataset.mode;home()}));bind('back',()=>{page=Math.max(0,page-1);home()});bind('next',()=>{page=(page+1)%pages;home()})}
function addQuiz(type){shuffle(deck).forEach(c=>steps.push({type,id:c.id}))}
function start(){if(selected.length<2)return;deck=selected.map(byId).filter(Boolean);studyCourse=deck[0].group;steps=[];pos=0;session={};recorded=new Set();if(mode==='all'||mode==='learn')for(let r=0;r<config.rounds;r++)deck.forEach(c=>[0,1,2].forEach(fade=>steps.push({type:'learn',id:c.id,fade})));if(mode==='all'||mode==='p2w')addQuiz('p2w');if(mode==='all'||mode==='w2p')addQuiz('w2p');showStep()}
function showStep(){screen='study';answered=false;wrong=false;const s=steps[pos],c=byId(s.id);base((pos+1)+' / '+steps.length);$('back').disabled=pos===0;
 if(s.type==='learn'){$('main').innerHTML='<section class="stage"><div class="art" style="opacity:'+[1,config.fade,0][s.fade]+'">'+svg(c)+'</div><div class="word">'+c.word+'</div></section>';if(s.fade===0)say(c.word)}else{options=shuffle([c,...shuffle(deck.filter(x=>x.id!==c.id)).slice(0,config.choices-1)]);$('next').disabled=true;const imageQuestion=s.type==='p2w';$('main').innerHTML='<section class="quiz"><div class="'+(imageQuestion?'art':'word')+'">'+(imageQuestion?svg(c):c.word)+'</div><div class="choices" style="grid-template-columns:repeat('+Math.min(options.length,2)+',1fr);grid-template-rows:repeat('+Math.ceil(options.length/2)+',minmax(0,1fr))">'+options.map((o,i)=>'<button data-option="'+i+'" aria-label="'+o.word+'">'+(imageQuestion?o.word:svg(o))+'</button>').join('')+'</div></section>';
 document.querySelectorAll('[data-option]').forEach(b=>b.onclick=gated(()=>answer(options[Number(b.dataset.option)],b)));}
 bind('back',()=>{pos--;showStep()});bind('next',()=>{if(s.type!=='learn'&&!answered)return;pos++;pos<steps.length?showStep():finish()})}
function answer(c,b){if(answered)return;const s=steps[pos],key=s.type+':'+s.id;if(c.id!==s.id){wrong=true;b.classList.add('retry');$('message').textContent='もういちど';return}answered=true;b.classList.add('correct');$('message').textContent='○';$('next').disabled=false;document.querySelectorAll('[data-option]').forEach(x=>x.disabled=true);if(!recorded.has(key)){const p=progress[s.id]||{},q=p[s.type]||{first:0,total:0};q.total++;q.complete=true;if(!wrong)q.first++;p[s.type]=q;progress[s.id]=p;session[key]=!wrong;recorded.add(key);save()}say(c.word)}
function finish(){screen='finish';base('');$('back').disabled=true;$('next').textContent='つぎのセット';const total=Object.keys(session).length,first=Object.values(session).filter(Boolean).length,done=pool(studyCourse).every(complete),index=courses.findIndex(g=>g.id===studyCourse),nextCourse=done?courses[Math.min(index+1,courses.length-1)].id:studyCourse;let hint=done?'この だんかいは おわり！':(mode==='learn'?'えと ことばの もんだいにも ちょうせんしよう':'');if(done&&index<courses.length-1)hint+=' つぎは '+courses[index+1].label;
$('main').innerHTML='<section class="summary"><h2>よく がんばったね</h2><p>'+deck.map(c=>c.word).join('　')+'</p><p>'+(total?'はじめに えらべた：'+first+' / '+total:'ことばを よんだね')+'</p><p>'+hint+'</p><button id="again" class="primary">もういちど</button><p class="note">'+(storageOK?'':'この端末では記録を保存できません。')+'</p></section>';bind('again',start);bind('next',()=>{if(manualCourse)manualCourse=nextCourse;selected=nextSelection(nextCourse);start()})}
function score(id){const p=progress[id]||{};return ['p2w','w2p'].reduce((n,k)=>n+(p[k]?.first||0),0)}
function settings(){screen='settings';const course=activeCourse(),list=pool(course);selected=selected.filter(id=>list.some(c=>c.id===id));base('先生の設定');$('back').textContent='とじる';$('next').textContent='はじめる';const choices=(name,arr,val)=>'<select id="'+name+'">'+arr.map(([v,t])=>'<option value="'+v+'" '+(String(v)===String(val)?'selected':'')+'>'+t+'</option>').join('')+'</select>';
$('main').innerHTML='<section id="settings"><div class="controls"><label>段階 '+choices('course',[['auto','自動：'+courses.find(c=>c.id===course).label],...courses.map(c=>[c.id,c.label])],manualCourse||'auto')+'</label><label>語数 '+choices('size',[[2,'2'],[3,'3'],[4,'4'],[5,'5']],config.size)+'</label><label>選択肢 '+choices('choices',[[2,'2'],[3,'3'],[4,'4']],config.choices)+'</label><label>くり返し '+choices('rounds',[[1,'1周'],[2,'2周'],[3,'3周']],config.rounds)+'</label><label>絵 '+choices('fade',[[.15,'15%'],[.25,'25%'],[.4,'40%']],config.fade)+'</label><label><input id="voice" type="checkbox" '+(config.voice?'checked':'')+'>読上げ</label></div><p class="note">２～５語を選択。○＝両方向の問題で正解済み。全語に○が付くと次の段階へ。読字習得の判定ではありません。</p><div class="card-grid">'+list.map(c=>'<button data-kana="'+c.id+'" class="'+(selected.includes(c.id)?'selected':'')+'">'+c.word+(complete(c)?' ○':'')+'<small>'+((progress[c.id]?.p2w?.first)||0)+' / '+((progress[c.id]?.w2p?.first)||0)+'</small></button>').join('')+'</div><div><p class="note">基本：１→２→３→４文字。その後は濁音→撥音→半濁音→促音→拗音。先生は段階を直接選べます。</p><p class="note">記録はこのブラウザのみ。特殊音は代表語の入門カードです。「読む確認」は語・音に応じて先生と行います。</p><div class="controls"><button id="auto">未完了から選ぶ</button><button id="oral">読む確認</button><button id="reset">記録を消す</button><span id="selectedCount"></span></div></div></section>';
$('course').onchange=()=>{manualCourse=$('course').value==='auto'?null:$('course').value;page=0;selected=nextSelection(activeCourse());settings()};['size','choices','rounds','fade'].forEach(id=>$(id).onchange=()=>{config[id]=Number($(id).value);save()});$('voice').onchange=()=>{config.voice=$('voice').checked;save();if(config.voice)say('ひらがな')};document.querySelectorAll('[data-kana]').forEach(b=>b.onclick=gated(()=>{const id=b.dataset.kana;if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<5)selected.push(id);else{$('message').textContent='５語まで';return}b.classList.toggle('selected',selected.includes(id));updateCount()}));bind('auto',()=>{selected=nextSelection(course);settings()});bind('oral',()=>{if(selected.length)oralCheck(0)});let confirmReset=false;bind('reset',()=>{if(!confirmReset){confirmReset=true;$('reset').textContent='もう一度押すと消去';return}progress={};manualCourse=null;selected=['め','て'];page=0;save();settings()});bind('back',()=>{$('back').textContent='もどる';page=0;home()});bind('next',()=>{$('back').textContent='もどる';start()});updateCount()}
function oralCheck(i){screen='oral';base('先生と 読む確認');const id=selected[i],card=byId(id),prompt=/[っん]/.test(card.kana)?card.word:card.kana;$('back').disabled=true;$('next').disabled=true;$('main').innerHTML='<section class="summary"><p>こえに だして よもう</p><div class="word" style="font-size:clamp(100px,25vh,220px)">'+prompt+'</div><p class="note">先生が聞いて記録します（正解の読み上げはありません）。</p><div class="controls"><button id="readYes">よめた</button><button id="readNo">れんしゅう</button></div></section>';const mark=ok=>{const p=progress[id]||{};p.oral=p.oral||{yes:0,total:0};p.oral.total++;if(ok)p.oral.yes++;progress[id]=p;save();if(i+1<selected.length)oralCheck(i+1);else settings()};bind('readYes',()=>mark(true));bind('readNo',()=>mark(false));}
function updateCount(){$('selectedCount').textContent=selected.length+'語 選択';$('next').disabled=selected.length<2;}
bind('homeBtn',()=>{$('back').textContent='もどる';home()});bind('settingsBtn',settings);home();
